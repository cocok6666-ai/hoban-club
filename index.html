<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>즐당즐당 호반클럽</title>
<meta name="theme-color" content="#0b1511">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="호반클럽">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: 한 화면에 꽉 차는 구조. 위에서부터 조명, 제목, 라운드 탭, 추첨통, 같은 크기의 당구대 둘(세로), 네온. 남는 높이는 추첨통과 당구대가 나눠 쓴다. */
:root {
  color-scheme: dark;
  --bg: #0b1511;
  --fg: #f2e9d6;
  --muted: #b3a88f;
  --felt: #1b6a50;
  --felt-hi: #2a8a69;
  --felt-lo: #0f3d2c;
  --wood: #5a3820;
  --wood-hi: #7a4f2f;
  --wood-lo: #36200f;
  --brass: #d1a94c;
  --brass-lo: #8a6a28;
  --pocket: #050806;
  --btn: #d63d33;
  --btn-lo: #7e1c18;
  --btn-fg: #ffffff;
  --alt: #1f7a58;
  --alt-lo: #0d3d2b;
  --glass-a: rgba(255,255,255,.14);
  --glass-b: rgba(120,200,165,.07);
  --slot: 52px;
  --font-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', system-ui, sans-serif;
}
html { box-sizing: border-box; height: 100%; }
body {
  box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
  background-color: var(--bg);
  background-image:
    radial-gradient(125% 85% at 50% 34%, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%),
    linear-gradient(0deg, rgba(70,42,20,.55), rgba(70,42,20,0) 110px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, rgba(0,0,0,0) 1px 46px),
    linear-gradient(180deg, #16301f 0%, #10241a 50%, #09140f 100%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 0 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { position: relative; flex: 1 1 auto; min-height: 560px; width: 100%; max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; }
.top { flex: none; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-bottom: 6px; }
.sub { margin: 2px 0 0; color: #fff; font: 700 clamp(12px, 3.6vw, 15px)/1.3 var(--font-body); letter-spacing: .02em; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
.ttl { min-width: 0; }
h1 {
  position: relative; margin: 0; padding: 2px 10px 10px;
  display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 0 .12em;
  font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 12.6vw, 62px); line-height: 1.15; letter-spacing: .01em;
}
.wd { display: inline-flex; }
.ch { position: relative; display: inline-block; }
.ch::before {
  content: attr(data-c); position: absolute; left: 0; top: 0; white-space: nowrap; color: #6a3407;
  text-shadow: 0 1px 0 #7d3f0a, 0 2px 0 #74390a, 0 3px 0 #6a3407, 0 4px 0 #602f06, 0 5px 0 #562a05, 0 6px 0 #4c2504,
    0 9px 10px rgba(0,0,0,.6), 0 0 26px rgba(255,185,70,.55);
}
.fr {
  position: relative; display: block; color: transparent; -webkit-text-fill-color: transparent;
  background-image:
    linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, #fffbe0 0%, #ffe27a 34%, #ffb91f 52%, #ffd45a 70%, #fff0a8 100%);
  background-size: 250% 100%, 100% 100%; background-repeat: no-repeat; background-position: 160% 0, 0 0;
  -webkit-background-clip: text; background-clip: text;
  animation: shine 3.6s linear infinite; animation-delay: calc(var(--i) * .14s);
}
.club .ch { font-family: 'Jua', 'Noto Sans KR', sans-serif; }
.club .ch::before { content: none; }
.club .ch:nth-child(1) { --n: #ff3d8b; --n2: #ff9ccb; --nc: #fff0f6; }
.club .ch:nth-child(2) { --n: #22e3ff; --n2: #8cf2ff; --nc: #effdff; }
.club .ch:nth-child(3) { --n: #ffe21f; --n2: #fff08a; --nc: #fffde6; }
.club .ch:nth-child(4) { --n: #4dff7a; --n2: #a6ffbd; --nc: #f0fff4; }
.club .fr {
  background: none; -webkit-background-clip: border-box; background-clip: border-box;
  color: var(--nc); -webkit-text-fill-color: var(--nc); -webkit-text-stroke: .055em #000; paint-order: stroke fill;
  text-shadow: 0 0 .04em #fff, 0 0 .12em var(--n2), 0 0 .24em var(--n), 0 0 .46em var(--n), 0 0 .9em var(--n);
  animation: neonpulse 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.37s);
}
@keyframes neonpulse {
  0%, 100% { opacity: 1; filter: brightness(1); }
  46% { opacity: 1; filter: brightness(1.12); }
  50% { opacity: .78; filter: brightness(.9); }
  52% { opacity: 1; filter: brightness(1.15); }
  56% { opacity: .86; }
  58% { opacity: 1; }
}
.ball {
  position: relative; flex: none; align-self: center; display: inline-grid; place-items: center;
  width: 1.12em; height: 1.12em; border-radius: 50%; margin: 0 .04em;
  background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.75) 0 7%, rgba(255,255,255,0) 22%), radial-gradient(circle at 50% 50%, var(--bc) 0 62%, var(--bd) 100%);
  box-shadow: inset -.06em -.08em .14em rgba(0,0,0,.45), 0 .09em .14em rgba(0,0,0,.6), 0 0 .5em var(--bg);
  animation: roll 3.2s ease-in-out infinite;
}
.ball::before { content: ''; position: absolute; width: .62em; height: .62em; border-radius: 50%; background: #fbfbf4; box-shadow: inset 0 0 .06em rgba(0,0,0,.35); }
.ball b { position: relative; font: 400 .5em/1 var(--font-display); color: #16110a; }
.b1 { --bc: #f6c40f; --bd: #b98300; --bg: rgba(255,200,40,.5); }
.b2 { --bc: #e0262a; --bd: #8e0f14; --bg: rgba(255,70,60,.45); animation-delay: -1.6s; }
@keyframes roll { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-.1em) rotate(10deg); } }
@keyframes shine { 0% { background-position: 160% 0, 0 0; } 55%, 100% { background-position: -60% 0, 0 0; } }
.sp {
  position: absolute; width: 15px; height: 15px; background: #fff3b8; opacity: 0; pointer-events: none;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: tw 2.4s ease-in-out infinite;
}
.s1 { left: 2%; top: 4px; animation-delay: .2s; }
.s2 { right: 3%; top: -2px; animation-delay: 1.1s; width: 18px; height: 18px; }
.s3 { right: 28%; bottom: 0; animation-delay: 1.8s; width: 12px; height: 12px; }
@keyframes tw { 0%, 100% { transform: scale(.2) rotate(0deg); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.go {
  flex: none; font: 700 16px/1 var(--font-body); color: var(--btn-fg); background: var(--btn);
  border: 0; border-radius: 10px; padding: 13px 14px; min-width: 100px; cursor: pointer;
  box-shadow: 0 3px 0 var(--btn-lo);
}
.go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-lo); }
.bar .go { flex: 1 1 0; min-width: 0; padding: 0 10px; font-size: 16px; white-space: nowrap; }
.go:disabled { opacity: .62; cursor: default; }
.go:focus-visible, .link:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.stage { --sc: #3fb487; --sb: rgba(14,64,46,.62); --sg: rgba(120,230,185,.13);
  position: relative; z-index: 1; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  padding: 8px 10px 10px; border: 2px solid var(--sc); border-radius: 0 12px 12px 12px;
  background-color: var(--sb);
  background-image: linear-gradient(var(--sg) 1px, transparent 1px), linear-gradient(90deg, var(--sg) 1px, transparent 1px);
  background-size: 26px 26px; background-position: -1px -1px;
  box-shadow: 0 8px 22px -10px rgba(0,0,0,.7), inset 0 0 24px rgba(0,0,0,.28); }
.stage[data-r="2"] { --sc: #5b97e6; --sb: rgba(18,46,92,.66); --sg: rgba(130,180,255,.15); }
.drum-col { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.dslot { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#drum { filter: drop-shadow(0 12px 12px rgba(0,0,0,.4)); display: block; flex: none; width: min(100%, 340px); aspect-ratio: 340 / 380; height: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#drum.pick { cursor: pointer; }
.drum-col { position: relative; }
#status { position: absolute; left: 0; right: 0; bottom: 2px; margin: 0; text-align: center; font-size: 13px; line-height: 1.35; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.bar { flex: none; position: relative; z-index: 3; display: flex; align-items: flex-end; justify-content: flex-start; gap: 10px; margin: 0; }
.bar .go { align-self: stretch; margin-bottom: 7px; }

.tables { flex: 0 0 52%; min-height: 200px; min-width: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
.table { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.th { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 6px; margin-bottom: 4px; }
.th h2 { margin: 0; font: 400 15px/1.25 var(--font-display); }
.tag { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail {
  flex: 1 1 0; min-height: 0; display: flex; position: relative; padding: 8px; border-radius: 12px;
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, var(--wood-lo));
  box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 10px 16px -12px rgba(0,0,0,.55);
  transition: box-shadow .4s;
}
.table.done .rail { box-shadow: 0 0 0 2px var(--brass), 0 10px 16px -12px rgba(0,0,0,.55); }
.felt {
  flex: 1; min-height: 0; border-radius: 6px; display: grid; place-items: center;
  background: radial-gradient(120% 140% at 50% 35%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));
  box-shadow: inset 0 2px 12px rgba(0,0,0,.5);
}
.slots { display: flex; gap: 7px; }
.slot {
  flex: none; box-sizing: border-box; width: var(--slot); height: var(--slot); border-radius: 50%;
  border: 2px dashed rgba(255,255,255,.4); display: grid; place-items: center;
  color: rgba(255,255,255,.5); font: 400 18px var(--font-display);
}
.slot.filled { border-color: transparent; color: transparent; }
.chip {
  width: 100%; height: 100%; border-radius: 50%; background-size: 100% 100%;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); animation: land .34s ease-out;
}
@keyframes land { 0% { transform: scale(.88); } 55% { transform: scale(1.07); } 100% { transform: scale(1); } }
.pocket { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--pocket); box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 0 1.5px var(--brass-lo); }
.p-tl { left: 2px; top: 2px; } .p-tr { right: 2px; top: 2px; } .p-bl { left: 2px; bottom: 2px; } .p-br { right: 2px; bottom: 2px; }
.p-tm { left: calc(50% - 5px); top: 1px; } .p-bm { left: calc(50% - 5px); bottom: 1px; }
.fly {
  position: absolute; left: 0; top: 0; border-radius: 50%; background-size: 100% 100%;
  pointer-events: none; z-index: 20; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.4));
}
.lamp { flex: none; position: relative; z-index: 1; width: min(250px, 66%); margin: 0 auto 6px; }
.lamp svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 6px 12px rgba(255,200,110,.5)); }
.cone {
  position: absolute; z-index: 0; top: 24px; bottom: 0; left: 0; width: 100%; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,208,130,.30), rgba(255,208,130,.10) 55%, rgba(255,208,130,0));
  clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); filter: blur(10px); mix-blend-mode: screen;
}
.tabs { flex: none; position: relative; z-index: 2; display: flex; gap: 3px; width: fit-content; margin: 0 0 -2px; padding: 0; }
.tab { --sc: #3fb487; --sb: #12402f; min-width: 88px; padding: 10px 16px 9px; border: 2px solid rgba(255,255,255,.16); border-bottom: 0; border-radius: 10px 10px 0 0; background: rgba(0,0,0,.35); color: #b9ae93; font: 700 14px/1 var(--font-body); cursor: pointer; }
.tab[data-r="2"] { --sc: #5b97e6; --sb: #14305a; }
.tab.on { color: #fff; background: var(--sb); border-color: var(--sc); box-shadow: 0 -3px 10px -4px var(--sc); }
.tab:disabled { cursor: default; opacity: .6; }
.tab.on:disabled { opacity: 1; }
.tab:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.neon {
  flex: none; align-self: center; margin-top: 8px; pointer-events: none;
  padding: 2px 14px 2px calc(14px + .3em); border: 2px solid #ff6db8; border-radius: 999px;
  font: 400 clamp(13px, 4vw, 18px)/1.2 var(--font-display); letter-spacing: .3em; color: #ffe6f3;
  text-shadow: 0 0 3px #fff, 0 0 8px #ff4fa3, 0 0 18px #ff4fa3, 0 0 32px #ff1f86;
  box-shadow: 0 0 6px #ff4fa3, 0 0 16px rgba(255,79,163,.55), inset 0 0 8px rgba(255,79,163,.6);
  animation: flick 5.5s infinite;
}
@keyframes flick { 0%, 17%, 22%, 61%, 65%, 100% { opacity: 1; } 19%, 63% { opacity: .5; } 20.5% { opacity: .92; } }
@media (max-height: 760px) {
  h1 { font-size: clamp(28px, 11.6vw, 54px); padding-bottom: 6px; }
  .lamp { width: min(210px, 56%); }
}
@media (min-width: 760px) {
  body { padding-block: 0 20px; }
  .top { margin-bottom: 10px; }
  .stage { flex-direction: row; gap: 36px; }
  .drum-col { flex: 0 0 440px; }
  .tables { flex: 1 1 0; max-width: 480px; min-height: 0; }
  .th h2 { font-size: 18px; }
  .tag { font-size: 13px; }
  .rail { padding: 11px; border-radius: 14px; }
  .slots { gap: 14px; }
  .slot { font-size: 22px; }
  .pocket { width: 15px; height: 15px; }
  .p-tl { left: 3px; top: 3px; } .p-tr { right: 3px; top: 3px; } .p-bl { left: 3px; bottom: 3px; } .p-br { right: 3px; bottom: 3px; }
  .p-tm { left: calc(50% - 7px); top: 2px; } .p-bm { left: calc(50% - 7px); bottom: 2px; }
}
@media (prefers-reduced-motion: reduce) { .chip, .fr, .sp, .neon { animation: none; } .fr { background-position: -60% 0, 0 0; } }
</style>
</head>
<body>
<div class="app">
  <div class="cone" aria-hidden="true"></div>
  <div class="lamp" aria-hidden="true">
    <svg viewBox="0 0 250 34" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6b4f"/><stop offset="1" stop-color="#173d2c"/></linearGradient>
        <radialGradient id="blb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d0"/><stop offset=".4" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      </defs>
      <line x1="52" y1="-30" x2="52" y2="9" stroke="#8a6a28" stroke-width="1.4"/>
      <line x1="198" y1="-30" x2="198" y2="9" stroke="#8a6a28" stroke-width="1.4"/>
      <path d="M14 10 H236 L222 24 H28 Z" fill="url(#shd)" stroke="#d1a94c" stroke-width="1.2"/>
      <rect x="12" y="7" width="226" height="4" rx="2" fill="#d1a94c"/>
      <circle cx="75" cy="26" r="9" fill="url(#blb)"/>
      <circle cx="125" cy="26" r="9" fill="url(#blb)"/>
      <circle cx="175" cy="26" r="9" fill="url(#blb)"/>
    </svg>
  </div>
  <header class="top">
    <div class="ttl">
      <h1 aria-label="즐 호반클럽 당">
        <span class="ball b1" aria-hidden="true"><b>즐</b></span>
        <span class="wd club" aria-hidden="true"><span class="ch" data-c="호" style="--i:4"><span class="fr">호</span></span><span class="ch" data-c="반" style="--i:5"><span class="fr">반</span></span><span class="ch" data-c="클" style="--i:6"><span class="fr">클</span></span><span class="ch" data-c="럽" style="--i:7"><span class="fr">럽</span></span></span>
        <span class="ball b2" aria-hidden="true"><b>당</b></span>
        <i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i>
      </h1>
    </div>
    <p class="sub">모두가 4구 300점이 되는 그날까지</p>
  </header>

  <div class="bar">
  <nav class="tabs" id="tabs" role="tablist" aria-label="라운드">
    <button class="tab on" role="tab" aria-selected="true" data-r="1" type="button">1라운드</button>
    <button class="tab" role="tab" aria-selected="false" data-r="2" type="button" tabindex="-1">2라운드</button>
  </nav>
  <button id="go" class="go" type="button" disabled>추첨 시작</button>
  </div>

  <main class="stage" id="stage" data-r="1">
    <section class="drum-col" aria-label="추첨통">
      <div class="dslot" id="dslot">
        <canvas id="drum" width="340" height="380" role="img" aria-label="다섯 명의 얼굴이 새겨진 공이 들어 있는 추첨통"></canvas>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="tables" aria-label="추첨 결과">
      <article class="table" id="t0">
        <div class="th"><h2>1번 테이블</h2><span class="tag">2명조</span></div>
        <div class="rail"><div class="felt"><div class="slots" data-n="2"></div></div></div>
      </article>
      <article class="table" id="t1">
        <div class="th"><h2>2번 테이블</h2><span class="tag">3명조</span></div>
        <div class="rail"><div class="felt"><div class="slots" data-n="3"></div></div></div>
      </article>
    </section>
  </main>
</div>

<script>

    tabBtns.forEach(function (b) {
      var on = +b.getAttribute('data-r') === n;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
    });
    resetSlots(); resetBalls(); say('');
    if (sheetDone[n]) {
      placed[n].forEach(function (pl) { fillSlot(slots[pl.t][pl.j], pl.i); });
      balls.forEach(function (b) { b.mode = 'gone'; });
      tables.forEach(function (tb) { tb.classList.add('done'); });
      goBtn.disabled = false; goBtn.textContent = '다시 뽑기'; canvas.classList.remove('pick');
    } else { placed[n] = []; idleUI(); }
  }

  /* 화면 전환 연출: 현재 화면이 밀려 나가고 새 화면이 들어옴 */
  var switching = false;
  function switchSheet(n) {
    if (switching) return;
    var dir = n > round ? 1 : -1;
    if (RM || !stage.animate) { enterSheet(n); return; }
    switching = true;
    var w = Math.min(stage.clientWidth || 360, 420) * .6;
    var opt = { duration: 230, easing: 'cubic-bezier(.5,0,.9,.4)', fill: 'forwards' };
    tone(300, 520, .16, 'triangle', .1);
    var out = stage.animate([
      { transform: 'translateX(0) scale(1)', opacity: 1, filter: 'blur(0)' },
      { transform: 'translateX(' + (-dir * w) + 'px) scale(.94)', opacity: 0, filter: 'blur(5px)' }
    ], opt);
    out.onfinish = function () {
      enterSheet(n);
      var inn = stage.animate([
        { transform: 'translateX(' + (dir * w) + 'px) scale(.94)', opacity: 0, filter: 'blur(5px)' },
        { transform: 'translateX(0) scale(1)', opacity: 1, filter: 'blur(0)' }
      ], { duration: 330, easing: 'cubic-bezier(.1,.7,.2,1)' });
      out.cancel();
      inn.onfinish = function () { switching = false; };
      inn.oncancel = function () { switching = false; };
    };
  }

  /* ---------- 2라운드: 공을 직접 터치 ---------- */
  async function run2(first) {
    if (running || !ready || round !== 2) return;
    setRunning(true); sheetDone[2] = false; placed[2] = [];
    goBtn.disabled = true; goBtn.textContent = '추첨 중…'; canvas.classList.remove('pick');
    ensureAudio(); target = null; onHandoff = null; say('');
    var others = balls.filter(function (b) { return b !== first && b.mode === 'in'; });
    var second = others[rnd(others.length)];
    var rest = others.filter(function (b) { return b !== second; });
    // 1) 터치한 공은 바로 1번 테이블로, 동시에 나머지 4개는 섞이기 시작
    var ox = first.x, oy = first.y;
    first.mode = 'gone';
    spark(ox, oy, 16, 320, [COLORS[first.i], tok.brass]);
    tone(520, 780, .22, 'triangle', .16);
    var f1 = flyTo(first, slots[0][0], ox, oy);
    await phase(null, '', { air: 1.4, swirl: -650, jit: 900 }, 1000, 640);
    await phase(null, '', { mode: 'ring', spin: 4.4 }, 1200, 0);
    await phase(null, '', { mode: 'weave' }, 1300, 0);
    await phase(null, '', { air: 1.6, swirl: 700, jit: 1100 }, 1000, 560);
    await f1;
    tone(640, 260, .2, 'sine', .2);
    // 2) 두 번째 공이 1번 테이블로 가는 순간, 나머지 3개는 동시에 2번 테이블로
    setMix({ air: .55, swirl: 220, jit: 380 });
    second.sT = 0; second.boost = 0; target = second; second.mode = 'seek';
    await new Promise(function (r) { second.onGone = r; });
    target = null;
    tone(300, 110, .16, 'triangle', .14);
    tone(520, 780, .25, 'triangle', .16, .05); tone(780, 1040, .3, 'triangle', .14, .17);
    var fl = [flyTo(second, slots[0][1])];
    rest.forEach(function (rb, j) {
      var rx = rb.x, ry = rb.y;
      rb.mode = 'gone';
      fl.push(flyTo(rb, slots[1][j], rx, ry));
    });
    await Promise.all(fl);
    tone(640, 260, .2, 'sine', .2); tone(760, 300, .2, 'sine', .16, .06);
    finishRound();
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (round !== 2 || running || !ready || sheetDone[2]) return;
    var rc = canvas.getBoundingClientRect();
    var x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;
    var best = null, bd = 1e9;
    balls.forEach(function (b) {
      if (b.mode !== 'in') return;
      var d = Math.hypot(b.x - x, b.y - y);
      if (d < R + 10 && d < bd) { bd = d; best = b; }
    });
    if (best) run2(best);
  });
  tabBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      if (running || switching) return;
      var n = +b.getAttribute('data-r');
      if (n !== round) switchSheet(n);
    });
  });
  goBtn.addEventListener('click', function () {
    if (running) return;
    if (round === 1) run();
    else { sheetDone[2] = false; enterSheet(2); }
  });
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
